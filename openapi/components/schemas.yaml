
Client:
  type: object
  required:
    - id
    - name
    - email
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    email:
      type: string
      format: email
    phone:
      type: string
      nullable: true
    bio:
      type: string
      nullable: true
    avatar_url:
      type: string
      format: uri
      nullable: true
    created_at:
      type: string
      format: date-time

ClientInput:
  type: object
  required:
    - name
    - email
  properties:
    name:
      type: string
    email:
      type: string
      format: email
    phone:
      type: string
    bio:
      type: string
    avatar_url:
      type: string
      format: uri

Artist:
  type: object
  required:
    - id
    - name
    - email
    - styles
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    email:
      type: string
      format: email
    phone:
      type: string
    bio:
      type: string
    avatar_url:
      type: string
      format: uri
    styles:
      type: array
      items:
        type: string
    portfolio_urls:
      type: array
      items:
        type: string
        format: uri
    created_at:
      type: string
      format: date-time

ArtistInput:
  type: object
  required:
    - name
    - email
    - styles
  properties:
    name:
      type: string
    email:
      type: string
      format: email
    phone:
      type: string
    bio:
      type: string
    avatar_url:
      type: string
      format: uri
    styles:
      type: array
      items:
        type: string
    portfolio_urls:
      type: array
      items:
        type: string
        format: uri

Booking:
  type: object
  required:
    - id
    - client_id
    - artist_id
    - appointment_date
    - status
  properties:
    id:
      type: string
      format: uuid
    client_id:
      type: string
      format: uuid
    artist_id:
      type: string
      format: uuid
    appointment_date:
      type: string
      format: date-time
    status:
      type: string
      enum: [pending, confirmed, completed, canceled]
    notes:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

BookingInput:
  type: object
  required:
    - client_id
    - artist_id
    - appointment_date
  properties:
    client_id:
      type: string
    artist_id:
      type: string
    appointment_date:
      type: string
      format: date-time
    notes:
      type: string

BookingUpdate:
  type: object
  properties:
    appointment_date:
      type: string
      format: date-time
    status:
      type: string
      enum: [pending, confirmed, completed, canceled]
    notes:
      type: string

Message:
  type: object
  required:
    - id
    - sender_id
    - receiver_id
    - content
    - timestamp
  properties:
    id:
      type: string
      format: uuid
    sender_id:
      type: string
      format: uuid
    receiver_id:
      type: string
      format: uuid
    content:
      type: string
    timestamp:
      type: string
      format: date-time

MessageInput:
  type: object
  required:
    - sender_id
    - receiver_id
    - content
  properties:
    sender_id:
      type: string
    receiver_id:
      type: string
    content:
      type: string

MediaItem:
  type: object
  required:
    - filename
    - url
    - uploaded_by
    - uploaded_at
  properties:
    filename:
      type: string
    url:
      type: string
      format: uri
    uploaded_by:
      type: string
      enum: [client, artist]
    uploaded_at:
      type: string
      format: date-time
