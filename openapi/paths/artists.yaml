/artists:
  get:
    summary: Get all artists
    responses:
      '200':
        description: List of artists
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yaml#/Artist'

  post:
    summary: Register a new artist
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ArtistInput'
    responses:
      '201':
        description: Artist created
      '400':
        $ref: '../components/responses.yaml#/BadRequest'

/artists/{artistId}:
  get:
    summary: Get a specific artist
    parameters:
      - name: artistId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Artist details
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Artist'
      '404':
        description: Artist not found
